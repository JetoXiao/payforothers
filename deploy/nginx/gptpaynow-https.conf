# Activate ONLY after the gptpaynow.com certificate has been issued and verified.
# Cloudflare must use Full (strict), never Flexible, with origin 43.163.239.213.
server {
    listen 80;
    listen [::]:80;
    server_name gptpaynow.com www.gptpaynow.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.gptpaynow.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gptpaynow.com;
    ssl_certificate /etc/letsencrypt/live/gptpaynow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gptpaynow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.gptpaynow.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.gptpaynow.com;
    ssl_certificate /etc/letsencrypt/live/gptpaynow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gptpaynow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://127.0.0.1:18003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
